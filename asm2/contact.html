<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Anh Phát</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">Anh Phát<span>.</span></a>

        <nav aria-label="Điều hướng chính">
            <ul class="nav-list">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
                <li><a href="contact.html" class="active">Liên hệ</a></li>
                <li><a href="login.html">Đăng nhập</a></li>
                <li>
                    <a href="cart.html">
                        Giỏ hàng (<span id="cartcount">0</span>)
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <div class="form-card">
                <div class="section-heading" style="margin-bottom: 24px;">
                    <p class="eyebrow">HỖ TRỢ KHÁCH HÀNG</p>
                    <h1>Liên hệ <span>Anh Phát</span></h1>
                    <p class="section-description">
                        Gửi thắc mắc hoặc góp ý của bạn, chúng tôi sẽ phản hồi sớm nhất.
                    </p>
                </div>

                <!-- Form Liên hệ được xử lý bởi initContactForm() trong app.js -->
                <form id="contact-form" novalidate>
                    <div class="form-group">
                        <label for="ct-fullname">Họ và tên *</label>
                        <input type="text" id="ct-fullname" placeholder="Nhập họ và tên (3 - 50 ký tự)">
                        <span class="error-message" id="err-ct-fullname"></span>
                    </div>

                    <div class="form-group">
                        <label for="ct-email">Email *</label>
                        <input type="email" id="ct-email" placeholder="example@gmail.com">
                        <span class="error-message" id="err-ct-email"></span>
                    </div>

                    <div class="form-group">
                        <label for="ct-phone">Số điện thoại *</label>
                        <input type="tel" id="ct-phone" placeholder="09xxxxxxxx (10 chữ số)">
                        <span class="error-message" id="err-ct-phone"></span>
                    </div>

                    <div class="form-group">
                        <label for="ct-message">Nội dung liên hệ *</label>
                        <textarea id="ct-message" rows="4" placeholder="Nhập nội dung cần hỗ trợ (10 - 500 ký tự)..."></textarea>
                        <span class="error-message" id="err-ct-message"></span>
                    </div>

                    <button type="submit" class="btn-submit">Gửi liên hệ</button>
                    <p class="form-success" id="contact-success"></p>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Anh Phát. Tinh tế trong từng gian bếp.</p>
    </footer>

    <script type="module" src="./app.js"></script>
    <script type="module" src="./auth.js"></script>
</body>
</html>
